<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="line" x1="10" y1="48" x2="54" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- Chart line -->
  <polyline points="12,44 22,36 30,40 38,24 48,28 54,16" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Data dots -->
  <circle cx="12" cy="44" r="3" fill="#ffffff"/>
  <circle cx="30" cy="40" r="3" fill="#ffffff"/>
  <circle cx="48" cy="28" r="3" fill="#ffffff"/>
  <circle cx="54" cy="16" r="3.5" fill="#fbbf24"/>
  <!-- Down arrow (price drop indicator) -->
  <path d="M16,48 L20,52 L12,52 Z" fill="#34d399" opacity="0.9"/>
</svg>
